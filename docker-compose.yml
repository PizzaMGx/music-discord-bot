services:
  bot:
    build:
      context: .
    container_name: discord-bot
    command: "python app.py"

    env_file: ".env"
    environment:
      # Keep new slash commands scoped to this server so they appear immediately.
      DISCORD_GUILD_ID: "752901417865445381"
    network_mode: "host"
    volumes:
      - ./app:/app
      - ./downloads:/downloads
      - ./playlists:/playlists
    
    dns:
      - 8.8.8.8
      - 8.8.4.4
